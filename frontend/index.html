<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Decision Debate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="masthead">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3V21" stroke="#cda868" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M4 7L2.5 11.5C2.5 12.8807 3.5 13.5 4.5 13.5C5.5 13.5 6.5 12.8807 6.5 11.5L5 7" stroke="#dd9a54" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M20 7L18.5 11.5C18.5 12.8807 19.5 13.5 20.5 13.5C21.5 13.5 22.5 12.8807 22.5 11.5L21 7" stroke="#4f8496" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 5L4 7.5" stroke="#dd9a54" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M12 5L20 7.5" stroke="#4f8496" stroke-width="1.4" stroke-linecap="round"/>
          <path d="M8 21H16" stroke="#cda868" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
        <span>A live argument, weighed</span>
      </div>
      <h1>Decision Debate</h1>
      <p class="subtitle">State a decision. Two sides will argue it out. A verdict will follow.</p>
      <div class="rule"></div>
    </header>

    <div class="input-row">
      <input id="decisionInput" type="text" placeholder="Should I take the new job offer?" />
      <button id="startBtn">Start Debate</button>
    </div>

    <div id="chat" class="chat"></div>
    <div id="verdict" class="verdict hidden"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
